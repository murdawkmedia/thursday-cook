# Every directory under packages/ is a workspace package. packages/plugins is a
# container rather than a package: one directory per dsh plugin fork or
# Thursday plugin, each its own package, so it gets a glob of its own.
packages:
  - "packages/*"
  - "packages/plugins/*"
  # The marketing site. It is not a package of the product, so it sits beside
  # packages/ rather than inside it, but it is a workspace project so that it
  # can depend on @trythursday/tokens and be picked up by the root recursive
  # build, typecheck and test scripts.
  - "website"

# Thursday bundles host and client halves with esbuild, so esbuild's install
# script must be allowed to fetch its platform binary. dotfiles-ai, which owns
# the build pipeline this workspace inherits, sets the same.
allowBuilds:
  esbuild: true

# The root holds the shared toolchain (typescript, vitest, prettier, esbuild)
# that every package inherits, so adding a dependency to the workspace root is
# intentional here rather than a mistake worth warning about.
ignoreWorkspaceRootCheck: true

# The pnpm content-addressable store. pnpm's default is under $PNPM_HOME, which
# sits outside this repository; agent sandboxes and CI images that can only
# write the checkout cannot populate it, and a `pnpm add` then aborts with
# ERR_PNPM_UNEXPECTED_STORE against the node_modules already linked here. A
# repo-local store keeps install self-contained. .pnpm-store is gitignored.
storeDir: .pnpm-store

