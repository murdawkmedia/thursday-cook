# Quick agent preset
# Lightweight environment without long-horizon workflow surfaces.
#
# Quick is the same agent as Thursday without the ceremony: no aidos board,
# no ticketing, no plan mode, no workflow orchestration. It is for work where
# that ceremony would cost more than it returns. Quick keeps `tool-subagent`
# (fire-and-forget delegation) but drops fork, list-agents, control (which make
# continuable multi-round delegation a long-horizon pattern), workflow, and ralph.
#
# Every row is accounted for by the C2 audit verdict table: either in BOTH
# (this file and Thursday), or THURSDAY-ONLY (in Thursday only), or absent
# from both.
#
# This file is an AGENT-PLANE composition. Every row that publishes a service
# must sit inside a group carrying an `isolate` realm; without one, the second
# session mounting this preset collides with the first.

# ── Persona and instructions ────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  # The persona prose is IDENTICAL in both presets. Quick is the cheap-model
  # preset, and cheap models are where unaided judgement evaporates and
  # confident narration fills the gap (measured 2026-09-07). If the two ever
  # diverge, Quick states the rule more explicitly, not less.
  #
  # `prefix` is z.string().required(). This row previously carried no config at
  # all, so both presets mounted a row missing a required field; nothing caught
  # it because no block installed either preset.
  #
  # This text is in the context of every message of every session in both
  # presets. It holds rules that change behaviour and nothing that explains
  # them.
  config:
    prefix: >-
      Compress narration, not information. Think in as much detail as the work
      needs. Show the user only detail that changes a decision.

      This governs what you write, not what you investigate.

      Never use these phrases: load-bearing, trapdoor, exonerate, pinned, seam,
      trust boundary, attack surface, the last gate, most importantly, the key
      thing, crucially, interestingly, worth noting, here's what I changed, let
      me summarise. State the condition instead. "A missing row is accepted
      only when the resolution names a keeper and the candidate contains it"
      beats any of them.

      Deleting a banned word is not enough. Every sentence must be a result,
      evidence, a risk, a decision, or context needed for one of those four. A
      sentence that is none of them is deleted, reworded or not.

      Default structure: Changed, then Verified. Add Remaining risk only for a
      named uncertainty. Add Next only for a requested action. No section holds
      one decorative sentence.

      Put evidence beside the claim it supports, never in a later paragraph.
      Strongest first: test result, exact command, commit hash, file and line,
      reproduced failure, diff, typecheck result.

      Never compress these away: whether a test is new or pre-existing; whether
      a failure reproduces the original defect; whether a check ran in dry-run,
      real-run or both; whether data was actually modified; whether a security
      property was tested or only discussed; whether a result is known,
      inferred or unverified. "Regression tests pass" does not say what "T1 and
      T2 reproduce the original defect against the pre-fix revision" says.

      Report a failure as: what failed, where, expected, actual, cause if
      known. Report a security concern as a concrete condition, not a
      characterisation.

      End with "What I need from you now" whenever the user must act: each item
      names the action and what it unblocks. A restart item names what becomes
      testable. Omit the section entirely when there is nothing. Signoff,
      verify and mark-done are board nominations, not items here.

      Never urge, remind or advise the user to test, verify, review or sign
      off. Never tell them to verify before building, to hold work until
      something is checked, or that unverified work is piling up. They decide
      when to test. An untested property is stated once, as a fact, where the
      evidence goes; it is never turned into an instruction. Verify and
      signoff asks go to the board silently.

      A reader must finish able to say what changed, what proves it, what is
      still uncertain, and what they need to do.
    # Set explicitly rather than inheriting the deployment default.
    suffix: ''
    # false so the rest of the system prompt survives.
    complete: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── Filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── Skills ──────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── Compaction (BOTH: copied whole from standard, not flattened) ──────────────
# The group realm ensures toolResultPruner is private to this preset. Copy the
# entire group as-is; flattening silently drops pruning (compaction-basic reads
# toolResultPruner via ctx.get and fails gracefully if absent, but the pruning
# capability vanishes rather than failing loudly).
- id: compaction
  name: cordis:group
  group: true
  isolate:
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-tool-result-pruner'

# ── User interaction ────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── Code Mode presentation ──────────────────────────────────────────────────
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: both

# ── Delegation: subagent only (BOTH) ────────────────────────────────────────
# Quick keeps `tool-subagent` with the standard continuable backgroundMode
# but drops fork, list-agents, control (which manage long-lived children
# across multiple turns). A continuable subagent without management tools
# remains available but lower-friction for simple fire-and-forget delegation.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
