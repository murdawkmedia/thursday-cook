<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 800" width="800" height="800" role="img"
     aria-label="Segmented cross mark with a die-cut white border" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- BR orange -> TL blue, spanning the canvas in user space so the ramp is
         continuous across the kerfs. The gradientTransform attribute is the
         static centered state; animateTransform drifts it either side. -->
    <linearGradient id="chroma" gradientUnits="userSpaceOnUse"
                    x1="700" y1="700" x2="100" y2="100"
                    gradientTransform="rotate(0 400 400)">
      <stop offset="0%"   stop-color="#ff8400" stop-opacity="1"/>
      <stop offset="26%"  stop-color="#ff9312" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#9a86b4" stop-opacity="0.24"/>
      <stop offset="74%"  stop-color="#0a5cff" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#0a5cff" stop-opacity="0.62"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        values="-22 400 400; 22 400 400; -22 400 400"
                        keyTimes="0; 0.5; 1"
                        calcMode="spline"
                        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
                        dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- White metal base, under the colour, so the fading end resolves to white -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="150" y1="140" x2="650" y2="660">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#e6ebf0"/>
    </linearGradient>

    <!-- Soft outer shadow so the white die-cut edge separates from a light plate -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="10.6"
                    flood-color="#0a0f1a" flood-opacity="0.31"/>
    </filter>

    <g id="mark">
      <!-- top shaft: rounded top, square where it meets the head -->
      <path d="M335 183 A33 33 0 0 1 368 150 L432 150 A33 33 0 0 1 465 183 L465 253 L335 253 Z"/>
      <!-- bottom shaft: square at the head, rounded at the tail -->
      <path d="M335 437 L465 437 L465 617 A33 33 0 0 1 432 650 L368 650 A33 33 0 0 1 335 617 Z"/>
      <!-- head: fully square -->
      <rect x="270" y="287" width="260" height="116"/>
      <!-- left cap: rounded outer edge, square inner -->
      <path d="M170 303 A16 16 0 0 1 186 287 L236 287 L236 403 L186 403 A16 16 0 0 1 170 387 Z"/>
      <!-- right cap: square inner, rounded outer -->
      <path d="M564 287 L614 287 A16 16 0 0 1 630 303 L630 387 A16 16 0 0 1 614 403 L564 403 Z"/>
    </g>
  </defs>

  <!-- Transparent plate: the kerfs and the surround read through to whatever
       the mark is placed on. -->
  <g transform="translate(400 400) scale(1.3) translate(-400 -400)" filter="url(#lift)">

    <!-- Die-cut border: stroke is centred on the outline, so half lands inside and
         is painted over by the layers above. Only the outer half survives. -->
    <use href="#mark" xlink:href="#mark"
         fill="#ffffff" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>

    <use href="#mark" xlink:href="#mark" fill="url(#body)"/>
    <use href="#mark" xlink:href="#mark" fill="url(#chroma)" opacity="0.82"/>
  </g>
</svg>
