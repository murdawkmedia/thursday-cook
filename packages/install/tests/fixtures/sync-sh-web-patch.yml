# Auto-generated by %HERE%/sync.sh. Do not hand-edit; re-run the script instead.
# Personal bundle host-plane rows: these apply to EVERY session regardless of
# preset — the MCP servers, the bash guard (rules read live from
# %DSH_HOME%/plugins/guards/*.json), the manifest guard, the package tool,
# and the profile-routed see vision helper. The plugin files resolve their
# @deepseek-ai/* imports against the host base (dsh install node_modules);
# unbash + the walker are bundled inside each plugin file.
- insert:
    - id: log-exporter
      name: %HERE%/plugins/log-exporter.js
    # Every MCP server now lives in the mcp-servers plugin, which reads
    # %DSH_HOME%/mcp-servers.json. The built-in dsh-mcp-client rows are gone:
    # two registrars for one server name would register each tool twice.
    - id: bash-guard
      name: %HERE%/plugins/bash-guard.js
      config:
        guardsDir: %DSH_HOME%/plugins/guards
    - id: manifest-guard
      name: %HERE%/plugins/manifest-guard.js
    - id: package-tool
      name: %HERE%/plugins/package-tool.js
    - id: skill-gate
      name: %HERE%/plugins/skill-gate.js
      config:
        # search/recall (dsh-compaction-basic, the dsh-compaction-instant
        # fork below) are superseded by resume_search/resume_read
        # (plugins/resume.ts). alwaysDeny hides them from every agent
        # unconditionally, unlike a skill's per-skill unlock: no skill may
        # re-expose them once loaded (Effort 9, PLAN.md).
        alwaysDeny: [search, recall]
    - id: see
      name: %HERE%/plugins/see.js
    - id: tmp-dsh-shared
      name: %HERE%/plugins/tmp-dsh-shared.js
    - id: grant
      name: %HERE%/plugins/grant.js

    - id: ask-interrupt
      name: %HERE%/plugins/ask-interrupt.js


    - id: profiles
      name: %HERE%/plugins/profiles.js
    - id: resume-command
      name: %HERE%/plugins/resume.js
    # The cordis_* tools, gated behind the two cordis skills via skill-gate.
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
    - id: compaction-instant
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-recall
      name: '@deepseek-ai/dsh-compaction-basic/tool'
    - id: ui-better-mobile
      name: dsh-plugin-better-mobile-ui
    # Vendored llm-pi-ai fork mounts as its own row; the builtin is disabled below.
    - id: llm-pi-ai-affinity
      name: '@deepseek-ai/dsh-llm-pi-ai'


# Override the builtin llm-pi-ai row: the vendored fork (linked into the
# web profile under the same package name) is the only pi-ai adapter
# registrar. Disabling the builtin avoids duplicate adapter registration;
# the fork mounts as llm-pi-ai-affinity in the insert list above.
- id: llm-pi-ai
  disabled: true

# Re-enable the /compact command. dsh-base mounts command-compact on the host
# plane, and dsh-web-app then disables it, because the web app moves the
# compaction backend into the preset plane. This bundle keeps a compaction
# engine on the host plane (compaction-instant above), so /compact belongs
# there too and should not depend on which preset a session uses. This MUST be
# a top-level override row, NOT a child of the insert list: dsh-base already
# owns that id, and a second one kills boot with
# "duplicate loader entry id: command-compact".
- id: command-compact
  disabled: false

# Config override for the self-mounting dsh-remote plugin (the plugin
# install step pins our fork). The plugin creates the remote row from its
# own bundle patch, so this MUST be a top-level override row, NOT a child
# of the insert list above: an insert row with the same id kills boot with
# "duplicate loader entry id: remote".
#
# applyEntryPatches assigns each override key WHOLESALE (target[key] = value,
# dsh-app-boot/lib/index.js). It does not deep-merge, so the block below must
# repeat every default from the plugin's own cordis.patch.yml. Only two values
# differ from those defaults:
#   session.secure: the proxy terminates TLS, so the cookie may carry Secure.
#   debug: registers POST /auth/trace, which writes client trace lines to the
#     server journal. Keep it false unless you debug a remote-mode fault. The
#     client half only ships traces when the page URL also carries ?dshTrace=1.
- id: remote
  config:
    enabled: true
    debug: true
    accounts: []
    secret: ''
    session:
      cookieName: dsh_session
      ttlSeconds: 604800
      secure: true
      sameSite: lax
    enforceRoles: true
    rateLimit:
      maxAttempts: 5
      windowMs: 900000
    files:
      roots:
        - /tmp/thursday

